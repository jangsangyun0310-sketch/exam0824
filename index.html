<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 할일</title>
<style>
  @font-face {
      font-family: 'DearFromsol';
      src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griun-fromsol-rg/griun-fromsol-rg/Griun_Fromsol-Rg.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
  }

  :root {
    --bg: #f2f4f7;
    --card-bg: #fff;
    --text: #222;
    --text-sub: #888;
    --border: #ddd;
    --border-light: #f0f0f0;
    --accent: #4a7dfc;
    --accent-hover: #3a6ae0;
    --filter-bg: #eef0f4;
    --filter-text: #555;
    --item-text: #333;
    --item-done: #aaa;
    --del-color: #ccc;
    --del-hover: #e05555;
    --empty-text: #bbb;
    --footer-text: #999;
    --shadow: rgba(0,0,0,0.08);
  }

  [data-theme="dark"] {
    --bg: #1a1c22;
    --card-bg: #24262e;
    --text: #eee;
    --text-sub: #999;
    --border: #3a3d47;
    --border-light: #32343c;
    --accent: #6690ff;
    --accent-hover: #7fa0ff;
    --filter-bg: #2f323b;
    --filter-text: #ccc;
    --item-text: #ddd;
    --item-done: #666;
    --del-color: #666;
    --del-hover: #ff6b6b;
    --empty-text: #666;
    --footer-text: #777;
    --shadow: rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'DearFromsol', -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
    transition: background 0.2s ease;
  }
  .card {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    border-radius: 12px;
    box-shadow: 0 4px 16px var(--shadow);
    padding: 24px;
    transition: background 0.2s ease;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    color: var(--text);
  }
  .theme-toggle {
    background: var(--filter-bg);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .date {
    margin: 0 0 20px;
    font-size: 13px;
    color: var(--text-sub);
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .add-btn {
    background: var(--accent);
    color: #fff;
  }
  .add-btn:hover { background: var(--accent-hover); }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .filters button {
    background: var(--filter-bg);
    color: var(--filter-text);
    font-size: 13px;
    padding: 6px 12px;
  }
  .filters button.active {
    background: var(--accent);
    color: #fff;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    min-height: 40px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border-light);
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  li span {
    flex: 1;
    font-size: 14px;
    color: var(--item-text);
    word-break: break-word;
  }
  li.done span {
    text-decoration: line-through;
    color: var(--item-done);
  }
  li .del-btn {
    background: none;
    color: var(--del-color);
    font-size: 18px;
    padding: 2px 6px;
    line-height: 1;
  }
  li .del-btn:hover { color: var(--del-hover); }

  .empty {
    text-align: center;
    color: var(--empty-text);
    font-size: 13px;
    padding: 20px 0;
  }

  .footer {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--footer-text);
  }
  .clear-btn {
    background: none;
    color: var(--footer-text);
    text-decoration: underline;
    padding: 2px 4px;
  }
  .clear-btn:hover { color: var(--del-hover); }
</style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <h1>오늘의 할일</h1>
    <button class="theme-toggle" id="theme-toggle" title="테마 변경">🌙</button>
  </div>
  <p class="date" id="today"></p>

  <form id="todo-form">
    <input type="text" id="todo-input" placeholder="할 일을 입력하세요" autocomplete="off">
    <button type="submit" class="add-btn">추가</button>
  </form>

  <div class="filters">
    <button data-filter="all" class="active">전체</button>
    <button data-filter="active">진행중</button>
    <button data-filter="done">완료</button>
  </div>

  <ul id="todo-list"></ul>
  <p class="empty" id="empty-msg" style="display:none;">할 일이 없습니다.</p>

  <div class="footer">
    <span id="count">0개 남음</span>
    <button class="clear-btn" id="clear-done">완료 항목 삭제</button>
  </div>
</div>

<script>
  const THEME_KEY = 'todo-theme';
  const themeToggleBtn = document.getElementById('theme-toggle');

  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggleBtn.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeToggleBtn.textContent = '🌙';
    }
  }

  const savedTheme = localStorage.getItem(THEME_KEY) ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(savedTheme);

  themeToggleBtn.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
  });

  const STORAGE_KEY = 'todo-list-items';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  let currentFilter = 'all';

  const listEl = document.getElementById('todo-list');
  const formEl = document.getElementById('todo-form');
  const inputEl = document.getElementById('todo-input');
  const emptyMsg = document.getElementById('empty-msg');
  const countEl = document.getElementById('count');
  const filterButtons = document.querySelectorAll('.filters button');
  const clearDoneBtn = document.getElementById('clear-done');

  const todayEl = document.getElementById('today');
  const now = new Date();
  const days = ['일','월','화','수','목','금','토'];
  todayEl.textContent = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function render() {
    listEl.innerHTML = '';
    const filtered = todos.filter(t => {
      if (currentFilter === 'active') return !t.done;
      if (currentFilter === 'done') return t.done;
      return true;
    });

    emptyMsg.style.display = filtered.length === 0 ? 'block' : 'none';

    filtered.forEach(todo => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.addEventListener('change', () => toggleTodo(todo.id));

      const span = document.createElement('span');
      span.textContent = todo.text;

      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });

    const remaining = todos.filter(t => !t.done).length;
    countEl.textContent = `${remaining}개 남음`;
  }

  function addTodo(text) {
    todos.push({ id: Date.now(), text, done: false });
    save();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.done = !todo.done;
    save();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    addTodo(text);
    inputEl.value = '';
    inputEl.focus();
  });

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  clearDoneBtn.addEventListener('click', () => {
    todos = todos.filter(t => !t.done);
    save();
    render();
  });

  render();
</script>

</body>
</html>
